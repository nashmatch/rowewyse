<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shelby County &mdash; DPA Eligibility Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap');
  :root {
    --blue: #00539B;
    --blue-light: rgba(0,83,155,0.14);
    --blue-border: rgba(0,83,155,0.32);
    --blue-text: #4d8fcc;
    --grey-light: rgba(0,0,0,0.04);
    --grey-border: rgba(0,0,0,0.15);
    --bg: #ffffff;
    --surface: #f7f8fa;
    --surface2: #f0f2f5;
    --border: #e2e5ea;
    --border2: #d0d4db;
    --text: #1a1d27;
    --text2: #4a4f5e;
    --text3: #7a8090;
    --text4: #a0a6b4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  header { background:#fff; border-bottom:1px solid var(--border); padding:14px 24px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
  .header-left h1 { font-family:'DM Serif Display',serif; font-size:20px; font-weight:400; color:#1a1d27; }
  .header-left p  { font-size:12px; color:var(--text3); margin-top:2px; font-weight:300; }
  .header-right   { display:flex; gap:8px; align-items:center; flex-shrink:0; }

  .badge { font-size:11px; font-weight:600; padding:4px 12px; border-radius:20px; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; }
  .badge-blue { background:var(--blue-light); color:var(--blue); border:1px solid var(--blue-border); }
  .badge-grey { background:rgba(0,0,0,0.05); color:#777; border:1px solid rgba(0,0,0,0.12); }

  .map-container { display:flex; flex:1; overflow:hidden; }
  #map { flex:1; z-index:1; }

  .sidebar { width:300px; background:#fff; border-left:1px solid var(--border); display:flex; flex-direction:column; z-index:10; overflow:hidden; box-shadow:-2px 0 8px rgba(0,0,0,0.04); position:relative; }

  .search-area { padding:18px 16px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .search-area label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--text3); display:block; margin-bottom:8px; }
  .search-input-wrap { position:relative; }
  .search-input-wrap input { width:100%; background:#fff; border:1.5px solid var(--border2); color:var(--text); padding:10px 44px 10px 12px; border-radius:8px; font-size:13px; font-family:'DM Sans',sans-serif; outline:none; transition:border-color .2s; }
  .search-input-wrap input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,83,155,0.08); }
  .search-input-wrap input::placeholder { color:#b8bcc8; }
  .search-btn { position:absolute; right:6px; top:50%; transform:translateY(-50%); background:var(--blue); border:none; color:#fff; width:30px; height:30px; border-radius:6px; cursor:pointer; font-size:16px; transition:opacity .15s; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .search-btn:hover { opacity:.85; }
  .search-btn:disabled { background:#c0c6d0; cursor:not-allowed; opacity:1; }

  .address-result { margin-top:10px; padding:10px 12px; border-radius:8px; font-size:12px; display:none; animation:fadeIn .2s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
  .address-result.eligible   { background:var(--blue-light); border:1px solid var(--blue-border); }
  .address-result.ineligible { background:rgba(0,0,0,0.04); border:1px solid rgba(0,0,0,0.1); }
  .address-result.error      { background:rgba(200,40,40,.06); border:1px solid rgba(200,40,40,.2); }
  .address-result.searching  { background:rgba(0,83,155,.05); border:1px solid rgba(0,83,155,.15); }
  .result-status  { font-size:13px; font-weight:600; margin-bottom:3px; }
  .result-address { color:var(--text3); font-size:11px; margin-top:2px; line-height:1.4; }
  .result-tract   { color:var(--text4); font-size:11px; margin-top:2px; }

  /* Program toggle area — placeholder for future DPA programs */


  /* Stats */
  .stats-bar { padding:14px 16px; border-top:1px solid var(--border); display:flex; justify-content:space-around; flex-shrink:0; }
  .stat-summary { text-align:center; }
  .stat-summary .num { font-size:22px; font-weight:700; line-height:1; }
  .stat-summary .lbl { font-size:10px; color:var(--text4); text-transform:uppercase; letter-spacing:.06em; margin-top:3px; font-weight:500; }
  .num-blue  { color:var(--blue); }
  .num-grey  { color:#aaa; }
  .num-total { color:#555; }

  /* Info panel */
  .info-panel { background:var(--surface); border-top:1px solid var(--border); padding:14px 16px; flex-shrink:0; min-height:110px; display:flex; flex-direction:column; justify-content:center; }
  .info-panel.empty p { color:var(--text4); font-size:12px; text-align:center; font-style:italic; }
  .info-tract-title { font-family:'DM Serif Display',serif; font-size:16px; color:#1a1d27; margin-bottom:8px; }
  .info-stats { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:10px; }
  .stat-box { background:#fff; border:1px solid var(--border); border-radius:6px; padding:8px 10px; }
  .stat-label { font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--text4); font-weight:500; }
  .stat-value { font-size:14px; font-weight:600; color:#1a1d27; margin-top:2px; }
  .eligibility-tag { display:inline-block; font-size:11px; font-weight:600; padding:4px 12px; border-radius:20px; letter-spacing:.04em; text-transform:uppercase; }
  .elig-tag-yes { background:var(--blue-light); color:var(--blue); border:1px solid var(--blue-border); }
  .elig-tag-no  { background:rgba(0,0,0,0.05); color:#888; border:1px solid rgba(0,0,0,0.1); }

  /* Spacer so info panel is pushed to bottom */
  .sidebar-spacer { flex:1; }

  /* Map */
  .leaflet-container { background:#e8ecf0 !important; }

  /* Remove focus outline on map interactions */
  #map:focus,
  .leaflet-container:focus,
  .leaflet-interactive:focus {
    outline: none !important;
  }
  .leaflet-interactive {
    outline: none !important;
  }

  .leaflet-control-attribution { font-size:10px; }
  .custom-tooltip { background:#fff !important; border:1px solid #dde1ea !important; color:#1a1d27 !important; border-radius:6px !important; padding:8px 12px !important; font-family:'DM Sans',sans-serif !important; font-size:12px !important; box-shadow:0 4px 16px rgba(0,0,0,0.1) !important; pointer-events:none !important; }
  .spinner { display:inline-block; width:10px; height:10px; border:2px solid rgba(0,83,155,0.2); border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite; margin-right:6px; vertical-align:middle; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ── Collapsible sidebar ─────────────────────────────────────────────── */
  .map-container { position: relative; }
  .sidebar { transition: width 0.32s cubic-bezier(.4,0,.2,1); overflow: visible !important; }
  .sidebar.collapsed { width: 0 !important; }
  .sidebar.collapsed .sidebar-inner { pointer-events: none; opacity: 0; }
  .sidebar-inner {
    width: 300px;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #fff;
    transition: opacity 0.2s ease;
  }
  .sidebar-toggle {
    position: absolute;
    left: -36px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 72px;
    background: #fff;
    border: 1px solid var(--border);
    border-right: none;
    border-radius: 10px 0 0 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: -3px 0 10px rgba(0,0,0,0.08);
    z-index: 100;
    transition: background 0.15s;
  }
  .sidebar-toggle:hover { background: #f5f7fa; }
  .sidebar-toggle .chevron {
    font-size: 16px;
    color: #888;
    transition: transform 0.32s cubic-bezier(.4,0,.2,1);
    display: inline-block;
    line-height: 1;
  }
  .sidebar.collapsed .sidebar-toggle { border-right: 1px solid var(--border); border-radius: 10px; left: -36px; }
  .sidebar.collapsed .sidebar-toggle .chevron { transform: rotate(180deg); }

  /* Program toggle buttons */
  .program-area { padding:16px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .program-area > label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--text3); display:block; margin-bottom:10px; }
  .program-list { display:flex; flex-direction:column; gap:6px; }
  .program-btn {
    width:100%; background:#fff; border:1.5px solid var(--border2);
    color:var(--text2); padding:10px 14px; border-radius:8px;
    font-size:12px; font-family:'DM Sans',sans-serif; font-weight:500;
    cursor:pointer; text-align:left; display:flex; align-items:center;
    gap:10px; transition:all .15s;
  }
  .program-btn:hover { border-color:var(--border); background:#fafbfc; }
  .program-btn.active-pinnacle {
    background:var(--blue-light); border-color:var(--blue-border); color:var(--blue);
  }
  .program-btn.active-hipc {
    background:rgba(22,101,52,0.10); border-color:rgba(22,101,52,0.32); color:#166534;
  }
  .prog-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .dot-pinnacle { background:var(--blue); }
  .dot-hipc     { background:#166534; }
  .prog-info    { flex:1; min-width:0; }
  .prog-name    { font-size:12px; font-weight:600; line-height:1.2; }
  .prog-sub     { font-size:10px; color:var(--text4); margin-top:2px; }
  .prog-badge   {
    font-size:10px; font-weight:600; padding:2px 8px;
    border-radius:10px; letter-spacing:.03em; white-space:nowrap;
  }
  .badge-active-pinnacle { background:var(--blue); color:#fff; }
  .badge-active-hipc     { background:#166534; color:#fff; }
  .badge-inactive        { background:var(--border); color:var(--text3); }

  /* Info panel program label */
  .program-label {
    font-size:10px; font-weight:600; text-transform:uppercase;
    letter-spacing:.06em; margin-bottom:6px;
  }
  .program-label.pinnacle { color:var(--blue); }
  .program-label.hipc     { color:#166534; }

  .elig-tag-hipc { background:rgba(22,101,52,0.10); color:#166534; border:1px solid rgba(22,101,52,0.28); }

  /* ZIP tooltip override */
  .zip-tooltip { font-family:'DM Sans',sans-serif; font-size:12px; }

  /* ── Multi-program result card ───────────────────────────────────────── */
  .result-address-line { font-size:11px; color:var(--text3); line-height:1.4; margin-bottom:8px; }
  .multi-result-header { font-size:13px; font-weight:700; margin-bottom:8px; color:#1a7a3a; }
  .multi-result-header.not-eligible { color:#aaa; font-weight:600; }
  .multi-program-list { display:flex; flex-direction:column; gap:5px; }
  .multi-program-item {
    display:flex; align-items:center; gap:8px;
    background:#f7f8fa; border:1px solid var(--border);
    border-radius:7px; padding:7px 10px;
  }
  .multi-prog-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .multi-prog-info { flex:1; min-width:0; }
  .multi-prog-name { font-size:12px; font-weight:600; color:var(--text); line-height:1.2; }
  .multi-prog-detail { font-size:10px; color:var(--text4); margin-top:1px; }
  .multi-prog-check { font-size:14px; font-weight:700; flex-shrink:0; }
  .result-tract { font-size:11px; color:var(--text4); margin-top:6px; }
  .num-hipc { color:#166534; }
  /* ── Check Eligibility button ─────────────────────────────────────────────── */
  .qualify-btn {
    background: var(--blue); color: #fff; border: none;
    padding: 9px 18px; border-radius: 8px; font-size: 13px;
    font-family: 'DM Sans', sans-serif; font-weight: 600;
    cursor: pointer; letter-spacing: .02em; transition: opacity .15s;
  }
  .qualify-btn:hover { opacity: .88; }

  /* ── Modal overlay ────────────────────────────────────────────────────── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.45); z-index: 9000;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: #fff; border-radius: 14px; width: 520px; max-width: 95vw;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25);
    animation: modalIn .22s ease;
  }
  @keyframes modalIn { from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:translateY(0)} }

  .modal-header {
    padding: 22px 24px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .modal-header h2 {
    font-family: 'DM Serif Display', serif; font-size: 22px;
    font-weight: 400; color: #1a1d27; margin-bottom: 3px;
  }
  .modal-header p { font-size: 12px; color: var(--text3); }
  .modal-close {
    background: none; border: none; font-size: 22px; color: #aaa;
    cursor: pointer; line-height: 1; padding: 0 0 0 12px; flex-shrink: 0;
  }
  .modal-close:hover { color: #555; }

  .modal-body { padding: 20px 24px 24px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }

  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .07em; color: var(--text3);
  }
  .form-group input,
  .form-group select {
    background: #fff; border: 1.5px solid var(--border2);
    color: var(--text); padding: 9px 12px; border-radius: 8px;
    font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none;
    transition: border-color .2s; width: 100%;
  }
  .form-group input:focus,
  .form-group select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,83,155,.08); }
  .form-group input::placeholder { color: #b8bcc8; }

  .form-hint { font-size: 11px; color: var(--text4); margin-top: 2px; }
  .req { color: #e53e3e; margin-left: 2px; }

  .form-divider {
    grid-column: 1 / -1; border: none; border-top: 1px solid var(--border);
    margin: 4px 0;
  }

  .modal-footer {
    padding: 16px 24px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 10px;
  }
  .btn-cancel {
    background: none; border: 1.5px solid var(--border2); color: var(--text2);
    padding: 9px 18px; border-radius: 8px; font-size: 13px;
    font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer;
    transition: all .15s;
  }
  .btn-cancel:hover { background: var(--surface); }
  .btn-submit {
    background: var(--blue); color: #fff; border: none;
    padding: 9px 22px; border-radius: 8px; font-size: 13px;
    font-family: 'DM Sans', sans-serif; font-weight: 600; cursor: pointer;
    transition: opacity .15s;
  }
  .btn-submit:hover { opacity: .88; }

  /* Results panel inside modal */
  .results-panel {
    display: none; padding: 0 24px 24px;
  }
  .results-panel.show { display: block; }
  .results-title {
    font-family: 'DM Serif Display', serif; font-size: 18px;
    color: #1a1d27; margin-bottom: 14px;
  }
  .result-program-card {
    border: 1.5px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px;
  }
  .result-program-card.rank-1 { border-color: rgba(0,83,155,.35); background: rgba(0,83,155,.04); }
  .rpc-rank {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #fff;
  }
  .rpc-info { flex: 1; }
  .rpc-name { font-size: 13px; font-weight: 600; color: #1a1d27; }
  .rpc-reason { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .rpc-status {
    font-size: 11px; font-weight: 600; padding: 3px 10px;
    border-radius: 12px; flex-shrink: 0;
  }
  .rpc-eligible { background: rgba(0,83,155,.12); color: var(--blue); }
  .rpc-ineligible { background: rgba(0,0,0,.05); color: #999; }
  .btn-adjust {
    background: none; border: 1.5px solid var(--border2); color: var(--text2);
    padding: 7px 14px; border-radius: 8px; font-size: 12px;
    font-family: 'DM Sans', sans-serif; font-weight: 600; cursor: pointer;
    transition: all .15s; white-space: nowrap;
  }
  .btn-adjust:hover { background: var(--surface); border-color: var(--blue); color: var(--blue); }

  .num-purple { color:#7c3aed; }
  .dot-p100 { background:#7c3aed; }
  .program-btn.active-p100 { background:rgba(124,58,237,0.12); border-color:rgba(124,58,237,0.32); color:#7c3aed; }
  .badge-active-p100 { background:#7c3aed; color:#fff; }
  .num-thda { color:#b45309; }
  .dot-thda { background:#d97706; }
  .program-btn.active-thda { background:rgba(180,83,9,0.10); border-color:rgba(180,83,9,0.32); color:#b45309; }
  .badge-active-thda { background:#b45309; color:#fff; }
  /* ── 30-second nudge modal ───────────────────────────────────────────── */
  .nudge-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.5); z-index: 8000;
    align-items: center; justify-content: center;
  }
  .nudge-overlay.open { display: flex; }
  .nudge-modal {
    background: #fff; border-radius: 16px; width: 420px; max-width: 92vw;
    box-shadow: 0 24px 64px rgba(0,0,0,.28);
    animation: modalIn .25s ease; overflow: hidden;
  }
  .nudge-banner {
    background: var(--blue); padding: 28px 28px 22px;
    text-align: center;
  }
  .nudge-banner .nudge-icon { font-size: 36px; margin-bottom: 10px; }
  .nudge-banner h3 {
    font-family: 'DM Serif Display', serif; font-size: 22px;
    color: #fff; font-weight: 400; line-height: 1.3; margin: 0;
  }
  .nudge-body {
    padding: 20px 28px 24px; text-align: center;
  }
  .nudge-body p {
    font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 20px;
  }
  .nudge-body p strong { color: var(--text); }
  .nudge-actions { display: flex; flex-direction: column; gap: 10px; }
  .nudge-cta {
    background: var(--blue); color: #fff; border: none;
    padding: 13px 20px; border-radius: 9px; font-size: 14px;
    font-family: 'DM Sans', sans-serif; font-weight: 600;
    cursor: pointer; transition: opacity .15s; letter-spacing: .01em;
  }
  .nudge-cta:hover { opacity: .88; }
  .nudge-dismiss {
    background: none; border: none; color: var(--text4);
    font-size: 12px; font-family: 'DM Sans', sans-serif;
    cursor: pointer; padding: 4px; transition: color .15s;
  }
  .nudge-dismiss:hover { color: var(--text2); }



  /* ── Animated pointer for Check Eligibility button ──────────── */
  .qualify-btn-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 0;
  }

  .qualify-pointer {
    display: inline-block;
    font-size: 22px;
    line-height: 1;
    animation: pointerSlide 1.1s ease-in-out infinite;
    transform-origin: center;
    color: #1a1d27;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
    pointer-events: none;
    margin-right: 2px;
    margin-left: -6px;
  }

  @keyframes pointerSlide {
    0%   { transform: translateX(-4px); opacity: 0.6; }
    50%  { transform: translateX(4px);  opacity: 1;   }
    100% { transform: translateX(-4px); opacity: 0.6; }
  }

  /* Stop animation once clicked */
  .qualify-btn-wrap.used .qualify-pointer {
    animation: none;
    opacity: 0;
    width: 0;
    margin: 0;
    overflow: hidden;
    transition: all 0.3s ease;
  }

  @media (max-width: 640px) {
    .qualify-pointer { font-size: 15px; margin-right: 2px; margin-left: -4px; }

    /* Keep wrap aligned on mobile */
    .qualify-btn-wrap {
      display: inline-flex;
      align-items: center;
    }

    /* Ensure header right doesn't overflow */
    .header-right {
      flex-shrink: 0;
    }
  }


  /* ── Info / Help button ──────────────────────────────────────────────── */
  .info-btn {
    position: fixed;
    bottom: 24px;
    left: 24px;
    z-index: 1000;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #1a1d27;
    color: #fff;
    border: none;
    font-size: 18px;
    font-weight: 700;
    font-family: 'DM Serif Display', serif;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s, box-shadow .15s;
    line-height: 1;
  }
  .info-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 5px 18px rgba(0,0,0,0.32);
  }

  /* ── Instructions modal ─────────────────────────────────────────────── */
  .info-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.45); z-index: 9000;
    align-items: center; justify-content: center;
  }
  .info-overlay.open { display: flex; }

  .info-modal {
    background: #fff; border-radius: 14px;
    width: 480px; max-width: 93vw; max-height: 88vh;
    overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25);
    animation: modalIn .22s ease;
  }

  .info-modal-header {
    padding: 20px 22px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .info-modal-header h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 20px; font-weight: 400; color: #1a1d27;
  }
  .info-modal-close {
    background: none; border: none; font-size: 20px;
    color: #aaa; cursor: pointer; padding: 0 0 0 12px;
  }
  .info-modal-close:hover { color: #555; }

  .info-modal-body { padding: 18px 22px 24px; }

  .info-step {
    display: flex; gap: 14px; margin-bottom: 18px;
    align-items: flex-start;
  }
  .info-step:last-child { margin-bottom: 0; }

  .info-step-num {
    width: 30px; height: 30px; border-radius: 50%;
    background: #1a1d27; color: #fff;
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }

  .info-step-content h3 {
    font-size: 13px; font-weight: 600; color: #1a1d27;
    margin-bottom: 3px;
  }
  .info-step-content p {
    font-size: 12px; color: var(--text3); line-height: 1.55;
  }
  .info-step-content p strong { color: var(--text2); }

  .info-divider {
    border: none; border-top: 1px solid var(--border);
    margin: 16px 0;
  }

  .info-legend { display: flex; flex-direction: column; gap: 8px; }
  .info-legend-item {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; color: var(--text2);
  }
  .info-legend-dot {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
  }

  @media (max-width: 640px) {
    .info-btn { bottom: 16px; left: 16px; width: 38px; height: 38px; font-size: 16px; }
    .info-overlay { align-items: flex-end !important; }
    .info-modal {
      width: 100% !important; max-width: 100% !important;
      border-radius: 20px 20px 0 0 !important;
      animation: slideUp .28s ease !important;
    }
    .info-modal-body { padding: 14px 18px 28px; }
  }

  /* ═══════════════════════════════════════════════════════════════
     MOBILE OPTIMIZATIONS  (≤ 640px)
  ═══════════════════════════════════════════════════════════════ */
  @media (max-width: 640px) {

    /* ── Layout: stack map on top, panel below ───────────────── */
    body { overflow: hidden; height: 100dvh; }

    .map-container {
      flex-direction: column !important;
      height: calc(100dvh - 56px);
    }

    #map {
      flex: 1 1 55% !important;
      min-height: 0;
    }

    /* ── Sidebar becomes a bottom sheet ─────────────────────── */
    .sidebar {
      width: 100% !important;
      flex: 0 0 auto;
      border-left: none !important;
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 16px rgba(0,0,0,0.08) !important;
      max-height: 45vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      transition: max-height 0.32s cubic-bezier(.4,0,.2,1) !important;
    }

    .sidebar.collapsed {
      max-height: 0 !important;
      width: 100% !important;
      border-top: none;
    }

    .sidebar-inner {
      width: 100% !important;
    }

    /* ── Toggle tab moves to top center ─────────────────────── */
    .sidebar-toggle {
      position: absolute;
      left: 50% !important;
      top: -28px !important;
      transform: translateX(-50%) !important;
      width: 56px !important;
      height: 28px !important;
      border-radius: 10px 10px 0 0 !important;
      border-bottom: none !important;
      border-right: 1px solid var(--border) !important;
      box-shadow: 0 -3px 10px rgba(0,0,0,0.08) !important;
    }

    .sidebar.collapsed .sidebar-toggle {
      top: -28px !important;
      border-radius: 10px 10px 0 0 !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
    }

    .sidebar-toggle .chevron {
      transform: rotate(90deg) !important;
    }

    .sidebar.collapsed .sidebar-toggle .chevron {
      transform: rotate(-90deg) !important;
    }

    /* ── Header compact ──────────────────────────────────────── */
    header {
      padding: 10px 14px;
      flex-shrink: 0;
    }

    .header-left h1 { font-size: 15px; }
    .header-left p  { display: none; }

    .qualify-btn {
      padding: 7px 12px;
      font-size: 12px;
    }

    /* ── Search area ─────────────────────────────────────────── */
    .search-area { padding: 12px 12px 10px; }

    /* ── Program buttons: horizontal scroll row ──────────────── */
    .program-area { padding: 8px 12px 10px; }

    .program-list {
      flex-direction: row !important;
      overflow-x: auto;
      gap: 6px;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .program-list::-webkit-scrollbar { display: none; }

    .program-btn {
      flex-shrink: 0;
      width: auto !important;
      padding: 7px 10px;
      font-size: 11px;
    }

    .prog-sub { display: none; }

    .prog-name { font-size: 11px; white-space: nowrap; }

    /* ── Stats bar ───────────────────────────────────────────── */
    .stats-bar { padding: 8px 12px; }
    .stat-summary .num { font-size: 18px; }
    .stat-summary .lbl { font-size: 9px; }

    /* ── Info panel ──────────────────────────────────────────── */
    .info-panel { min-height: 70px; padding: 10px 12px; }
    .info-panel.empty p { font-size: 11px; }
    .info-tract-title { font-size: 14px; margin-bottom: 6px; }
    .info-stats { gap: 4px; margin-bottom: 6px; }
    .stat-box { padding: 6px 8px; }
    .stat-value { font-size: 12px; }

    /* ── Modal: full screen on mobile ────────────────────────── */
    .modal-overlay {
      align-items: flex-end !important;
    }

    .modal {
      width: 100% !important;
      max-width: 100% !important;
      max-height: 92dvh !important;
      border-radius: 20px 20px 0 0 !important;
      animation: slideUp .28s ease !important;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }

    .modal-header { padding: 16px 18px 12px; }
    .modal-header h2 { font-size: 18px; }
    .modal-body { padding: 14px 18px 18px; }

    /* ── Form: single column on mobile ──────────────────────── */
    .form-grid {
      grid-template-columns: 1fr !important;
      gap: 12px;
    }

    .form-group input,
    .form-group select {
      font-size: 16px !important; /* prevents iOS zoom on focus */
      padding: 11px 12px;
    }

    .modal-footer {
      padding: 12px 18px;
      position: sticky;
      bottom: 0;
      background: #fff;
      border-top: 1px solid var(--border);
    }

    .btn-submit, .btn-cancel {
      flex: 1;
      text-align: center;
      padding: 12px;
    }

    /* ── Results panel ───────────────────────────────────────── */
    .results-panel { padding: 0 18px 18px; }
    .results-title { font-size: 16px; margin-bottom: 10px; }
    .result-program-card { padding: 10px 12px; gap: 8px; }
    .rpc-rank { width: 28px; height: 28px; font-size: 12px; }
    .rpc-name { font-size: 12px; }
    .rpc-reason { font-size: 10px; }

    /* ── Nudge modal: bottom sheet ───────────────────────────── */
    .nudge-overlay { align-items: flex-end !important; }
    .nudge-modal {
      width: 100% !important;
      border-radius: 20px 20px 0 0 !important;
      animation: slideUp .28s ease !important;
    }
    .nudge-banner { padding: 22px 22px 16px; }
    .nudge-body { padding: 16px 22px 28px; }

    /* ── Address result card ─────────────────────────────────── */
    .address-result { font-size: 11px; }
    .multi-result-header { font-size: 12px; }
    .multi-prog-name { font-size: 11px; }

    /* ── Touch targets: bigger tap areas ─────────────────────── */
    .search-btn { width: 36px; height: 36px; font-size: 18px; }
    .nudge-cta  { padding: 15px 20px; font-size: 15px; }
    .nudge-dismiss { padding: 10px; font-size: 13px; }
  }

  /* ── Medium screens (641–900px) ────────────────────────────── */
  @media (min-width: 641px) and (max-width: 900px) {
    .sidebar { width: 260px !important; }
    .sidebar-inner { width: 260px !important; }
    .prog-sub { font-size: 9px; }
    .modal { width: 480px; }
  }

</style>

<header>
  <div class="header-left">
    <h1>Shelby County &mdash; Loan Program Eligibility Map</h1>
    <p>Downpayment Assistance Programs &nbsp;&middot;&nbsp; Shelby County, TN</p>

  <div class="header-right">
    <div class="qualify-btn-wrap" id="qualifyBtnWrap">

      <button class="qualify-btn" onclick="openQualifyModal(); document.getElementById('qualifyBtnWrap').classList.add('used');">&#9998;&nbsp; Check Eligibility</button>
    </div>
  </div>
</header>

<div class="map-container">
  <div id="map"></div>

  <div class="sidebar" id="sidebar">

        <label>Check an Address</label>

        <label>DPA Program</label>
        <div class="program-list">

            <div class="prog-info">

              <div class="prog-sub">Census Tract boundaries</div>
            </div>
            <span class="prog-badge badge-active-pinnacle" id="badge-pinnacle">Active</span>
          </button>

          <button class="program-btn" id="btn-hipc" onclick="switchProgram('hipc')">

              <div class="prog-sub">Census Tract boundaries</div>

            <span class="prog-badge badge-inactive" id="badge-p100">Select</span>
          </button>

              <div class="prog-name">THDA</div>
              <div class="prog-sub">TN Housing Dev. Agency &mdash; Census Tracts</div>
            </div>
            <span class="prog-badge badge-inactive" id="badge-thda">Select</span>
          </button>

        </div>
      </div>

      <div class="sidebar-spacer"></div>

      <div class="stats-bar">

      </div>

      <div class="info-panel empty" id="infoPanel">
        <p>Enter an address above or<br>click any area on the map</p>
      </div>

    </div>
  </div>
</div>
